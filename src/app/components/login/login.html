<div class="min-h-screen flex items-center justify-center"
     style="background: linear-gradient(145deg, #0A2540 0%, #1A3560 60%, #0A2540 100%)">

  <!-- Decorative blobs -->
  <div style="position:fixed;top:-120px;right:-120px;width:400px;height:400px;
              border-radius:50%;background:rgba(0,196,204,0.06);pointer-events:none"></div>
  <div style="position:fixed;bottom:-80px;left:-80px;width:300px;height:300px;
              border-radius:50%;background:rgba(26,115,232,0.08);pointer-events:none"></div>

  <div class="bg-white rounded-2xl w-full max-w-sm flex flex-col items-center gap-6"
       style="padding:44px 40px;box-shadow:0 24px 64px rgba(0,0,0,0.35)">

    <!-- Logo -->
    <div class="flex flex-col items-center gap-3">
      <img src="/logo.avif" alt="WalletApp"
           style="width:68px;height:68px;border-radius:16px;object-fit:contain;
                  background:#EEF2FF;padding:8px;" />
      <span style="font-size:1.4rem;font-weight:800;color:#0A2540;letter-spacing:-0.02em">
        WalletApp
      </span>
    </div>

    <!-- Divider -->
    <div style="width:100%;height:1px;background:#E2E8F0"></div>

    <!-- Text -->
    <div class="text-center">
      <h2 style="font-size:1.05rem;font-weight:600;color:#0A2540;margin:0 0 6px">Iniciar sesión</h2>
      <p style="font-size:0.85rem;color:#64748B;margin:0">Usa tu cuenta corporativa de Azure</p>
    </div>

    <!-- Sign-in button -->
    <button
      class="w-full font-semibold py-3 px-6 rounded-xl transition-all cursor-pointer border-0 text-sm text-white"
      style="background:linear-gradient(135deg,#1A73E8,#00C4CC);
             box-shadow:0 4px 16px rgba(26,115,232,0.35);
             letter-spacing:0.01em"
      (click)="signIn()">
      Continuar con Microsoft
    </button>

  </div>
</div>
