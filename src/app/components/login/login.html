<div class="login-container">
  <div class="login-card">
    <div class="ms-brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 23 23">
        <rect x="1" y="1" width="10" height="10" fill="#f35325"/>
        <rect x="12" y="1" width="10" height="10" fill="#81bc06"/>
        <rect x="1" y="12" width="10" height="10" fill="#05a6f0"/>
        <rect x="12" y="12" width="10" height="10" fill="#ffba08"/>
      </svg>
      <span class="ms-brand-name">Microsoft</span>
    </div>
    <h2>Iniciar sesión</h2>
    <p class="subtitle">Usa tu cuenta corporativa de Azure para continuar</p>
    <button class="btn-signin" (click)="signIn()">
      Continuar con Microsoft
    </button>
  </div>
</div>
